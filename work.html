<style>
  :root {
    --paper: #FAFAF7;
    --ink: #1F1B1B;
    --ink-soft: #665C5C;
    --line: #E3D9D9;
    --accent: #C5050C;
    --chip: #F5E7E7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
    gap: 16px;
  }

  .name-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    object-fit: cover;
  }

  .name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .clocks {
    display: flex;
    gap: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
  }

  .clock-city { color: var(--ink); font-weight: 500; }
  .clock-time { letter-spacing: 0.02em; }
  .clock-zone { font-size: 10px; opacity: 0.7; }

  nav {
    display: flex;
    gap: 18px;
    margin-bottom: 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  nav a {
    color: var(--ink-soft);
    text-decoration: none;
    position: relative;
  }

  nav a.current { color: var(--ink); }
  nav a:hover { color: var(--accent); }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .projects {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .project-card {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.15s ease;
  }

  .project-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .project-card:hover {
    border-color: var(--accent);
  }

  .project-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }

  .project-title {
    font-size: 17px;
    font-weight: 600;
  }

  .project-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    margin-top: 3px;
  }

  .project-desc {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 14px;
  }

  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
  }

  footer {
    margin-top: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  /* ---------- Loading screen ---------- */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.7s ease;
  }

  #loading-screen.hide {
    opacity: 0;
    pointer-events: none;
  }

  #loading-screen img {
    width: 90px;
    height: 90px;
    border-radius: 14px;
    animation: heartbeat 1.8s ease-in-out 2;
  }

  #loading-screen .loading-text {
    font-family: 'Lora', serif;
    font-size: 17px;
    color: var(--ink-soft);
    text-align: center;
    opacity: 0;
    animation: fadeInText 0.8s ease 1.1s forwards;
  }

  @keyframes heartbeat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.18); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.18); }
    70%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @keyframes fadeInText {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    header { flex-direction: column; }
    .clocks { text-align: left; }
    .project-top { flex-direction: column; gap: 2px; }
  }
</style>
</head>

<script>
  const clocks = [
    { el: document.getElementById('clock1'), tz: 'America/Chicago' }
  ];

  function tick() {
    const now = new Date();
    clocks.forEach(c => {
      c.el.textContent = now.toLocaleTimeString('en-US', {
        timeZone: c.tz,
        hour12: false
      });
    });
  }
  tick();
  setInterval(tick, 1000);

  // ----- projects: edit this array with your real projects -----
  const projects = [
    {
      title: 'This Website',
      year: '2026',
      desc: 'A short description of what this project does and what you built or contributed.',
      tags: ['Placeholder', 'Placeholder'],
      video: ''
    },
    {
      title: 'PCOSync',
      year: '2025',
      desc: 'A short description of what this project does and what you built or contributed.',
      tags: ['Placeholder', 'Placeholder', 'Placeholder']
    },
    {
      title: 'Fitcycle',
      year: '2025',
      desc: 'A short description of what this project does and what you built or contributed.',
      tags: ['Placeholder']
    }
  ];

  const container = document.getElementById('projectsList');
  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
    card.innerHTML = `
      <div class="project-top">
        <div class="project-title">${p.title}</div>
        <div class="project-year">${p.year}</div>
      </div>
      <p class="project-desc">${p.desc}</p>
      <div class="project-tags">${tagsHtml}</div>
    `;
    container.appendChild(card);
  });

  // ----- fade-in reveal for project cards -----
  const cardObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 90);
        cardObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.project-card').forEach(el => cardObserver.observe(el));

  // ----- loading screen: heartbeat pulse + subheading, then fade out -----
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hide');
  }, 4000);
</script>
